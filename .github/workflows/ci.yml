name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: development
  SESSION_HTTPS_ONLY: "false"
  PUBLIC_ORIGIN: ""
  DATABASE_URL: "sqlite:///:memory:"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.6
      - run: ruff check app tests
      - run: ruff format --check app tests

  tests:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: retrieve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          # Each database test gets its own throwaway schema (tests/support.py).
          TEST_POSTGRES_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/retrieve_test' || '' }}
        run: python -m unittest discover -s tests -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retrieve-manager:ci .
      - name: Codec works inside the image
        run: >-
          docker run --rm retrieve-manager:ci python -c
          "import numpy, pydicom, pynetdicom, openjpeg, psycopg;
          from app.codec import encode, PROFILE_LOSSLESS;
          print('ok')"
