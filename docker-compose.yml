x-service-defaults: &service-defaults
  build: .
  # One named image for every service: `docker save retrieve-manager:latest`
  # moves the whole application to a server without internet.
  image: retrieve-manager:latest
  env_file: .env
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  volumes:
    - retrieve-data:/data
    - c:/mobile:/mobile
    - /opt/idr:/opt/idr
  environment: &service-environment
    APP_ENV: production
    TZ: America/Sao_Paulo
    DATA_DIR: /data
    POSTGRES_HOST: postgres
    ALLOWED_DATA_ROOTS: /mobile,/opt/idr
    STORE_PORT_MAP: "444:10444"

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB: ${POSTGRES_DB:-retrieve}
      POSTGRES_USER: ${POSTGRES_USER:-retrieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    # Consultas paralelas usam /dev/shm; os 64 MB padrão do Docker fazem
    # consultas grandes falharem com "could not resize shared memory segment".
    shm_size: ${PG_SHM_SIZE:-256mb}
    # Ajustes para um banco que cresce por anos. Memória: dimensione pelo
    # servidor no .env (PG_SHARED_BUFFERS ~25% da RAM livre para o banco).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      # Disco SSD/NVMe; em disco mecânico use 4.
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
      - -c
      - checkpoint_timeout=15min
      # Transação esquecida aberta impede o vacuum e incha as tabelas; nenhum
      # fluxo do app mantém transação parada por mais que alguns segundos.
      - -c
      - idle_in_transaction_session_timeout=${PG_IDLE_IN_TRANSACTION_TIMEOUT:-30min}
      # Diagnóstico: consultas lentas, esperas por lock, vacuum demorado e
      # ordenações que transbordam para disco.
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION:-1000}
      - -c
      - log_lock_waits=on
      - -c
      - log_autovacuum_min_duration=10s
      - -c
      - log_temp_files=10MB
      - -c
      - track_io_timing=on
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retrieve} -d ${POSTGRES_DB:-retrieve}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  data-permissions:
    build: .
    image: retrieve-manager:latest
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    environment:
      TZ: America/Sao_Paulo
    network_mode: none
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - retrieve-data:/data

  web:
    <<: *service-defaults
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --no-access-log
    environment:
      <<: *service-environment
      SERVICE_NAME: retrieve-manager-web
      STORE_CHECK_HOSTS: receiver
    ports:
      # Somente o proxy reverso local acessa a tela; veja APP_BIND_ADDRESS.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      data-permissions:
        condition: service_completed_successfully

  worker:
    <<: *service-defaults
    command: python -m app.worker
    environment:
      <<: *service-environment
      SERVICE_NAME: retrieve-manager-worker
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/retrieve-worker.ready'; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<900 else 1)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      web:
        condition: service_healthy

  receiver:
    <<: *service-defaults
    command: python -m app.receiver
    environment:
      <<: *service-environment
      SERVICE_NAME: retrieve-manager-receiver
    # Store SCP (pynetdicom). Outras portas de unidade entram aqui e em
    # STORE_PORT_MAP.
    ports:
      - "444:10444"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/retrieve-receiver.ready'; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<120 else 1)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      web:
        condition: service_healthy

volumes:
  retrieve-data:
  postgres-data:
