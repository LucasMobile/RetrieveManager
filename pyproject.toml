[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy inspeciona as anotações durante a criação de cada classe no
# Python 3.14; referências futuras sem aspas geram NameError nesse ponto.
"app/models.py" = ["UP037"]
