<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b33">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
  <link rel="alternate icon" type="image/x-icon" href="/static/favicon.ico?v=1">
  <title>{{ status_code }} · Retrieve Manager</title>
  <script src="/static/theme.js?v=1"></script>
  <link rel="stylesheet" href="/static/app.css?v=34">
</head>
<body>
<main class="error-page">
  <section class="surface error-panel" aria-labelledby="error-title">
    <a class="brand" href="{{ home_href }}" aria-label="Retrieve Manager — início">
      <img class="error-panel__logo" src="/static/logo-white.png?v=1" alt="Mobilemed" width="965" height="174">
      <span class="visually-hidden">Retrieve Manager</span>
    </a>
    <div class="error-panel__code">ERRO {{ status_code }}</div>
    <h1 id="error-title">{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn--primary" href="{{ action_href }}">{{ action_label }}</a>
    {% if request_id %}<small class="error-panel__request">ID da solicitação: <span class="mono">{{ request_id }}</span></small>{% endif %}
  </section>
</main>
</body>
</html>
