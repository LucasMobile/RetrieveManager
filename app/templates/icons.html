{% macro icon(name, class_name="icon", label=None) -%}
<svg class="{{ class_name }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision" focusable="false"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}>

    <path d="M3 12h4l2.5-7 5 14 2.5-7h4" />

    <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />

    <path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
  {% elif name == "menu" %}

    <rect x="3" y="4" width="18" height="6" rx="2" /><rect x="3" y="14" width="18" height="6" rx="2" /><path d="M7 7h.01M7 17h.01M11 7h7M11 17h7" />

    <rect x="3" y="3" width="18" height="18" rx="2" /><path d="M7 8h10v7l-3 3h-4l-3-3Z" /><path d="M9 8v3M12 8v3M15 8v3" />

    <circle cx="8" cy="15" r="4" /><path d="m11 12 8-8M15 8l2 2M17 6l2 2" />
  {% else %}
    <circle cx="12" cy="12" r="9" />
