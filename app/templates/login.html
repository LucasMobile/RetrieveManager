{% from "icons.html" import icon %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d3c">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
  <link rel="alternate icon" type="image/x-icon" href="/static/favicon.ico?v=1">
  <title>Entrar · Retrieve Manager</title>
  <link rel="stylesheet" href="/static/app.css?v=18">
  <script src="/static/app.js?v=8" defer></script>
</head>
<body class="login-page">
<a class="skip-link" href="#login-form">Pular para o formulário</a>
<main class="login-shell">
  <div class="login-visual" aria-hidden="true">
    <img src="/static/login-background.webp?v=1" alt="" width="2500" height="3125">
  </div>

  <section class="login-main" aria-labelledby="login-title">
    <div class="login-panel">
      <h1 class="visually-hidden" id="login-title">Acessar o Retrieve Manager</h1>
      <img class="login-panel__logo" src="/static/mobilemed-login.png?v=1" alt="Mobilemed" width="384" height="161">

      {% if error %}
      <div class="login-alert" role="alert">
        {{ icon("alert") }}<span>{{ error }}</span>
      </div>
      {% endif %}

      <form class="form-stack" id="login-form" method="post" action="/login">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="field__control">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="field__action field__action--icon" type="button" data-password-toggle="password" data-password-label="senha" aria-label="Mostrar senha" title="Mostrar senha" aria-pressed="false">
              <span data-password-show>{{ icon("eye") }}</span>
              <span data-password-hide hidden>{{ icon("eye-off") }}</span>
            </button>
          </div>
        </div>
        <button class="btn btn--primary" type="submit">Entrar</button>
      </form>

      <p class="login-panel__status"><span aria-hidden="true"></span>Acesso restrito a usuários autorizados</p>
    </div>
  </section>
</main>
</body>
</html>
